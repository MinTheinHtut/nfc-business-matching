[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Keep browser authentication same-origin. The splat excludes the leading
# /api/, so /api/auth/login maps to the backend's /api/auth/login exactly once.
[[redirects]]
  from = "/api/*"
  to = "https://nfc-business-matching.onrender.com/api/:splat"
  status = 200
  force = true

# This must remain after the API proxy so the SPA fallback cannot intercept API calls.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
